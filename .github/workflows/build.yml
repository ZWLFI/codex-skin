name: macOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and run self-test
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: codex-skin-universal
          path: |
            dist/*.zip
            dist/*.sha256
